concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
name: IDD doctor health gate
on:
  pull_request:
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  idd-doctor:
    name: IDD doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checks out the source
        uses: actions/checkout@v7
        with:
          # The detached HEAD keeps the worktree check inert on CI.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup the pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Prepare the Node.js environment
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version
      - env:
          HUSKY: 0
          PNPM_CONFIG_VIRTUAL_STORE_TYPE: project
        name: Install the dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - env:
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        name: Run the IDD doctor
        run: pnpm exec idd-doctor
    timeout-minutes: 5
