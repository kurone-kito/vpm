env:
  listPublishDirectory: Website
  pathToCi: ci
name: Build on pull request targeting main for testing
# Runs only for pull requests targeting main; there is no separate
# push-triggered path.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    name: Build the page
    uses: ./.github/workflows/build-common.yml
