concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
name: Lint the Node.js project
on:
  pull_request:
  push:
    branches:
      - '**'
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checks out the source
        uses: actions/checkout@v7
      - name: Run actionlint
        uses: reviewdog/action-actionlint@2085657ab2c7f48c58edcc767fba576f63bea76b # v1.77.0
        with:
          fail_level: error
          filter_mode: nofilter
          reporter: local
      - name: Setup the pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Prepare the Node.js environment
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version
      - env:
          HUSKY: 0
          PNPM_CONFIG_VIRTUAL_STORE_TYPE: project
        name: Install the dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run the lint
        run: pnpm run lint
    timeout-minutes: 5
